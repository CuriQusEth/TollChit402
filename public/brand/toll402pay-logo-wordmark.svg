<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="Toll402Pay">
  <title>Toll402Pay</title>
  <!--
    Yatay kilit: solda bariyer işareti, sağda kelime markası.
    Kelime markası sistem mono ailesiyle çiziliyor; arayüzdeki başlıkta bu
    dosya değil, src/components/Logo.tsx içindeki satır içi sürüm kullanılıyor
    (orada metin gerçek HTML olduğu için her sistemde aynı görünür). Bu dosya
    favicon/OG gibi harici kullanımlar için.
  -->
  <rect width="280" height="64" fill="none"/>

  <g>
    <path d="M8 50h48" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
    <g transform="rotate(-38 18 34)">
