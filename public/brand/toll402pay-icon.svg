<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Toll402Pay">
  <title>Toll402Pay</title>
  <!--
    Otoyol gişe bariyeri. Direk üstünde "402" yazan kontrol kutusu, kol
    kalkmış durumda — geçişe izin verilmiş, yani ödeme tamamlanmış.
    Kol emerald: arayüzdeki vurgu rengiyle aynı anlamı taşıyor.
    Renkler src/index.css'teki token'larla birebir aynı.
  -->
  <rect width="64" height="64" rx="8" fill="#050505"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="7.5" fill="none" stroke="#2a2a2a"/>

  <!-- Zemin çizgisi -->
  <path d="M8 50h48" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>

  <!-- Kalkmış kol: menteşeden yukarı sağa, şeritli -->
  <g transform="rotate(-38 18 34)">
    <rect x="18" y="30" width="36" height="8" rx="2" fill="#10b981"/>
    <path d="M27 30v8M36 30v8M45 30v8" stroke="#050505" stroke-width="3"/>
  </g>

  <!-- Menteşe -->
  <circle cx="18" cy="34" r="3" fill="#0a0a0a" stroke="#10b981" stroke-width="2"/>

  <!-- Direk üstündeki kontrol kutusu -->
  <rect x="10" y="14" width="16" height="14" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="8" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="0.5">402</text>

  <!-- Direk -->
  <rect x="15" y="28" width="6" height="22" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
</svg>
